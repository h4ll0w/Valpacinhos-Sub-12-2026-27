name: Atualizar resultados FPF

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-fpf-main
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Sincronizar dados da FPF
        run: node update-zonanorte-index.js update

      - name: Confirmar origem dos dados
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('zonanorte-championship-index.json','utf8')); if (data.metadata?.source === 'fallback_index_html') { console.error('A FPF não forneceu dados actuais; o fallback não será publicado.'); process.exit(1); } console.log('Origem dos dados:', data.metadata?.source);"

      - name: Validar índice
        run: node update-zonanorte-index.js validate

      - name: Verificar alterações
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- index.html zonanorte-championship-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar identidade Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guardar dados atualizados
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add index.html zonanorte-championship-index.json
          git commit -m "Atualizar resultados FPF"
          # O updater escreve logs/cache locais que não fazem parte do deploy.
          # O runner é descartável: limpar todos os tracked restantes evita
          # que qualquer artefacto auxiliar bloqueie o pull --rebase.
          git reset --hard HEAD
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push falhou na tentativa ${attempt}; a tentar novamente..."
            sleep $((attempt * 2))
          done
          echo "Não foi possível sincronizar e publicar as alterações." >&2
          exit 1

      - name: Sem alterações
        if: steps.changes.outputs.changed == 'false'
        run: echo "Não foram encontradas alterações nos resultados."

  publicar-pages:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código publicado
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto do site
        run: |
          mkdir _site
          cp index.html zonanorte-championship-index.json _site/
          touch _site/.nojekyll

      - name: Carregar artefacto do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
