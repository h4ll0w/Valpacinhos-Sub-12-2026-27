name: Update Calendario (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm you have run convert_calendario.py locally and want to push tblCalendario_supabase.csv to Supabase'
        required: true
        type: boolean

jobs:
  update-calendario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CSV exists
        run: |
          if [ ! -f "data/tblCalendario_supabase.csv" ]; then
            echo "❌ data/tblCalendario_supabase.csv not found"
            echo "Run locally: python3 data/convert_calendario.py"
            exit 1
          fi
          echo "✅ CSV found"
          head -5 data/tblCalendario_supabase.csv

      - name: Install Python dependencies
        run: pip install httpx python-dotenv

      - name: Update tblCalendario in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 << 'PYEOF'
          import base64
          import csv
          import json
          import os

          import httpx

          url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"].strip()

            if not key:
              raise SystemExit(
                  "❌ SUPABASE_SERVICE_ROLE_KEY is empty or missing. Check the repo secret name "
                  "matches the workflow env: block exactly."
              )
          # Sanity check: legacy JWT keys carry a "role" claim. Make sure we are
          # holding the service_role key and not the anon key (anon can usually
          # READ public tables but gets 401 on WRITES -- exactly what we saw).
          def jwt_role(token):
              try:
                  payload = token.split(".")[1]
                  payload += "=" * (-len(payload) % 4)
                  return json.loads(base64.urlsafe_b64decode(payload)).get("role")
              except Exception:
                  return None

          if key.startswith("eyJ"):
              role = jwt_role(key)
              print(f"Key role: {role}")
              if role != "service_role":
                  raise SystemExit(
                      f"❌ SUPABASE_SERVICE_ROLE_KEY has role '{role}', expected 'service_role'. "
                      "Update the GitHub secret with the service_role key from Supabase "
                      "(Project Settings > API Keys)."
                  )

          # Same headers for reads and writes. PostgREST accepts both apikey and
          # Authorization; sending both is the standard Supabase pattern.
          headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }

          # Read CSV
          rows = []
          with open("data/tblCalendario_supabase.csv", "r", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f, delimiter=";")
              for row in reader:
                  cleaned = {}
                  for k, v in row.items():
                      if v == "":
                          cleaned[k] = None
                      elif k in ["Jornada", "IdEquipaCasa", "IdEquipaFora", "IdEstadio", "IdZona"]:
                          cleaned[k] = int(v)
                      elif k in ["ResultadoCasa", "ResultadoFora"]:
                          cleaned[k] = int(v)
                      else:
                          cleaned[k] = v
                  rows.append(cleaned)

          print(f"Read {len(rows)} matches from CSV")

          # Fetch existing matches to map natural key -> IdJogo
          with httpx.Client(timeout=30.0) as client:
              resp = client.get(
                  f"{url}/rest/v1/tblcalendario",
                  headers={**headers, "Accept": "application/json"},
                  params={
                      "select": "IdJogo,Jornada,IdEquipaCasa,IdEquipaFora,IdZona",
                      "limit": "10000",
                  },
              )
              if resp.status_code >= 400:
                  raise SystemExit(f"❌ GET failed: HTTP {resp.status_code}: {resp.text}")
              existing = resp.json()

          existing_map = {}
          for m in existing:
              k = (m["Jornada"], m["IdEquipaCasa"], m["IdEquipaFora"], m["IdZona"])
              existing_map[k] = m["IdJogo"]

          # Split into two uniform payloads. PostgREST rejects a bulk request where
          # objects have different key sets, so existing rows (with IdJogo) and new
          # rows (without IdJogo, auto-generated) must be sent separately.
          updates = []
          inserts = []
          for row in rows:
              k = (row["Jornada"], row["IdEquipaCasa"], row["IdEquipaFora"], row["IdZona"])
              if k in existing_map:
                  row["IdJogo"] = existing_map[k]
                  updates.append(row)
              else:
                  row.pop("IdJogo", None)
                  inserts.append(row)

          print(f"Updates: {len(updates)} | Inserts: {len(inserts)}")

          def send(client, batch, prefer, params=None):
              resp = client.post(
                  f"{url}/rest/v1/tblcalendario",
                  headers={**headers, "Prefer": prefer},
                  params=params or {},
                  json=batch,
              )
              if resp.status_code >= 400:
                  raise SystemExit(f"❌ POST failed: HTTP {resp.status_code}: {resp.text}")

          batch_size = 50
          with httpx.Client(timeout=60.0) as client:
              for i in range(0, len(updates), batch_size):
                  batch = updates[i:i + batch_size]
                  send(
                      client,
                      batch,
                      "resolution=merge-duplicates,return=minimal",
                      params={"on_conflict": "IdJogo"},
                  )
                  print(f"Update batch {i // batch_size + 1}: {len(batch)} rows")

              for i in range(0, len(inserts), batch_size):
                  batch = inserts[i:i + batch_size]
                  send(client, batch, "return=minimal")
                  print(f"Insert batch {i // batch_size + 1}: {len(batch)} rows")

          print("✅ tblcalendario updated successfully")
          PYEOF

      - name: Summary
        run: echo "✅ tblCalendario updated in Supabase. Refresh index.html to see changes."
