name: Update Calendario (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm you have run convert_calendario.py locally and want to push tblCalendario_supabase.csv to Supabase'
        required: true
        type: boolean

jobs:
  update-calendario:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify CSV exists
        run: |
          if [ ! -f "data/tblCalendario_supabase.csv" ]; then
            echo "❌ data/tblCalendario_supabase.csv not found"
            echo "Run locally: python3 data/convert_calendario.py"
            exit 1
          fi
          echo "✅ CSV found"
          head -5 data/tblCalendario_supabase.csv

      - name: Install Python dependencies
        run: pip install httpx python-dotenv

      - name: Update tblCalendario in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 << 'PYEOF'
          import os
          import csv
          import httpx

          url = os.environ["SUPABASE_URL"].rstrip('/')
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          # Use both headers for GET (required), only Authorization for POST (apikey can cause 401 on writes)
          headers_write = {
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates,return=minimal"
          }
          headers_read = {
              "Authorization": f"Bearer {key}",
              "apikey": key,
              "Accept": "application/json"
          }

          # Read CSV
          rows = []
          with open("data/tblCalendario_supabase.csv", "r", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f, delimiter=";")
              for row in reader:
                  cleaned = {}
                  for k, v in row.items():
                      if v == "":
                          cleaned[k] = None
                      elif k in ["Jornada", "IdEquipaCasa", "IdEquipaFora", "IdEstadio", "IdZona"]:
                          cleaned[k] = int(v)
                      elif k in ["ResultadoCasa", "ResultadoFora"]:
                          cleaned[k] = int(v) if v else None
                      else:
                          cleaned[k] = v
                  rows.append(cleaned)

          print(f"Read {len(rows)} matches from CSV")

          # First, get existing matches to map
          with httpx.Client(timeout=30.0) as client:
              resp = client.get(
                  f"{url}/rest/v1/tblcalendario",
                  headers=headers_read,
                  params={"select": "IdJogo,Jornada,IdEquipaCasa,IdEquipaFora,IdZona"}
              )
              resp.raise_for_status()
              existing = resp.json()

          existing_map = {}
          for m in existing:
              key = (m["Jornada"], m["IdEquipaCasa"], m["IdEquipaFora"], m["IdZona"])
              existing_map[key] = m["IdJogo"]

          # Prepare upserts - only set IdJogo for existing records
          to_upsert = []
          for row in rows:
              key = (row["Jornada"], row["IdEquipaCasa"], row["IdEquipaFora"], row["IdZona"])
              if key in existing_map:
                  row["IdJogo"] = existing_map[key]
              else:
                  row.pop("IdJogo", None)  # Remove IdJogo for new records (auto-generated)
              to_upsert.append(row)

          # Upsert in batches using IdJogo as conflict target
          batch_size = 50
          with httpx.Client(timeout=60.0) as client:
              for i in range(0, len(to_upsert), batch_size):
                  batch = to_upsert[i:i+batch_size]
                  resp = client.post(
                      f"{url}/rest/v1/tblcalendario",
                      headers=headers_write,
                      params={"on_conflict": "IdJogo"},
                      json=batch
                  )
                  resp.raise_for_status()
                  print(f"Batch {i//batch_size + 1}: {len(batch)} rows upserted")

          print("✅ tblcalendario updated successfully")
          PYEOF

      - name: Summary
        run: echo "✅ tblCalendario updated in Supabase. Refresh index.html to see changes."
