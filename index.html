<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato Distrital Sub-12 | Valpacinhos</title>
    <style>
        :root {
            --primary-color: #ff6600; /* Laranja Valpacinhos */
            --secondary-color: #1a1a1a;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--secondary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        h2 {
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 8px;
            margin-top: 0;
            color: var(--secondary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--secondary-color);
            color: white;
            font-weight: 600;
        }

        th:nth-child(2), td:nth-child(2) {
            text-align: left;
        }

        tr:hover {
            background-color: #fafafa;
        }

        .valpacinhos {
            font-weight: bold;
            color: var(--primary-color);
            background-color: rgba(255, 102, 0, 0.05);
        }

        .scorers-list {
            list-style-type: none;
            padding: 0;
        }

        .scorers-list li {
            padding: 8px 12px;
            background: #f9f9f9;
            margin-bottom: 6px;
            border-left: 4px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CD Os Valpacinhos</h1>
            <p>Campeonato Distrital Sub-12 (Futebol 9 - Zona Norte) • 2026/2027</p>
        </header>

        <!-- Tabela de Classificação -->
        <div class="card">
            <h2>Tabela Classificativa</h2>
            <table id="tabela-classificacao">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Equipa</th>
                        <th>J</th>
                        <th>V</th>
                        <th>E</th>
                        <th>D</th>
                        <th>GM</th>
                        <th>GS</th>
                        <th>DG</th>
                        <th>Pts</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Melhores Marcadores -->
        <div class="card">
            <h2>Melhores Marcadores</h2>
            <ul id="lista-marcadores" class="scorers-list">
                <!-- Preenchido via JavaScript -->
            </ul>
        </div>
    </div>

    <script>
        // 1. Definição das Equipas do Campeonato
        let equipas = {
            "VALPACINHOS": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "J. PEDRAS SALGADAS": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "AUDC SABROSA \"C\"": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "GD BOTICAS": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "ADE GERAÇÃO TALENTOS \"A\"": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "VIDAGO FC": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "AD FLAVIENSE": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "GD CHAVES": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 },
            "GD VILAR PERDIZES": { p: 0, j: 0, v: 0, e: 0, d: 0, gm: 0, gs: 0 }
        };

        // 2. Resultados semanais (Com as vírgulas corretas entre linhas)
        const resultados = [
            { jornada: 1, casa: "VALPACINHOS", goloCasa: 3, fora: "J. PEDRAS SALGADAS", goloFora: 1 },
            { jornada: 2, casa: "AUDC SABROSA \"C\"", goloCasa: 9, fora: "VALPACINHOS", goloFora: 1 }
        ];

        // 3. Marcadores (Com as vírgulas corretas entre linhas)
        const marcadores = [
            { nome: "Pepe", equipa: "VALPACINHOS", golos: 1 },
            { nome: "Luis", equipa: "VALPACINHOS", golos: 1 },
            { nome: "Fábio", equipa: "VALPACINHOS", golos: 1 }
        ];

        // Processar resultados
        resultados.forEach(jogo => {
            let c = equipas[jogo.casa];
            let f = equipas[jogo.fora];

            if (c && f) {
                c.j++; f.j++;
                c.gm += jogo.goloCasa; c.gs += jogo.goloFora;
                f.gm += jogo.goloFora; f.gs += jogo.goloCasa;

                if (jogo.goloCasa > jogo.goloFora) {
                    c.v++; c.p += 3;
                    f.d++;
                } else if (jogo.goloCasa < jogo.goloFora) {
                    f.v++; f.p += 3;
                    c.d++;
                } else {
                    c.e++; c.p += 1;
                    f.e++; f.p += 1;
                }
            }
        });

        // Ordenar tabela por Pontos > Diferença de Golos > Golos Marcados
        let classificacaoArray = Object.keys(equipas).map(nome => {
            return {
                nome: nome,
                ...equipas[nome],
                dg: equipas[nome].gm - equipas[nome].gs
            };
        });

        classificacaoArray.sort((a, b) => {
            if (b.p !== a.p) return b.p - a.p;
            if (b.dg !== a.dg) return b.dg - a.dg;
            return b.gm - a.gm;
        });

        // Renderizar Tabela no HTML
        const tbody = document.querySelector("#tabela-classificacao tbody");
        classificacaoArray.forEach((eq, index) => {
            let tr = document.createElement("tr");
            if (eq.nome === "VALPACINHOS") {
                tr.classList.add("valpacinhos");
            }
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${eq.nome}</td>
                <td>${eq.j}</td>
                <td>${eq.v}</td>
                <td>${eq.e}</td>
                <td>${eq.d}</td>
                <td>${eq.gm}</td>
                <td>${eq.gs}</td>
                <td>${eq.dg > 0 ? '+' + eq.dg : eq.dg}</td>
                <td><strong>${eq.p}</strong></td>
            `;
            tbody.appendChild(tr);
        });

        // Renderizar Marcadores
        const listaMarcadores = document.querySelector("#lista-marcadores");
        if (marcadores.length === 0) {
            listaMarcadores.innerHTML = "<li><span>Ainda sem marcadores registados.</span><span>-</span></li>";
        } else {
            marcadores.sort((a, b) => b.golos - a.golos).forEach(m => {
                let li = document.createElement("li");
                li.innerHTML = `<span>${m.nome} (${m.equipa})</span> <strong>${m.golos} golos</strong>`;
                listaMarcadores.appendChild(li);
            });
        }
    </script>
</body>
</html>
